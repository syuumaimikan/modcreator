help.name={0}:이름 형태의 ID에 사용됩니다. 영문 소문자, 숫자, _만 쓸 수 있습니다.
help.name_path=영문 소문자, 숫자, _. /로 하위 폴더를 만들 수 있습니다. 예: chests/treasure
help.name_codefile=ModStudio 안에서만 쓰는 이름입니다.
help.mod_id=소문자 2~64자, 영문자로 시작. 배포 후에는 바꾸지 마세요.
help.mod_id_change=모드 ID를 바꾸면 프로젝트의 모든 참조도 함께 바뀝니다.
help.package=생성되는 코드의 Java 패키지. 예: com.yourname.mymod
help.version=모드 버전. 예: 1.0.0
help.icon=모드 목록과 팩 아이콘으로 표시됩니다.
help.texture=+를 눌러 새 텍스처를 그리거나 PNG 파일을 가져옵니다.
help.tooltip=이름 아래에 표시되는 줄. &6(금색) 같은 & 색상 코드를 쓸 수 있습니다.
help.nutrition=고기 아이콘 반 칸 단위. 스테이크는 8을 회복합니다.
help.saturation=포화도 계수. 스테이크는 0.8입니다.
help.tier=내구도, 채굴 등급, 기본 피해량을 정합니다.
help.attack_damage=등급 피해량에 더해집니다. 다이아몬드 검은 3입니다.
help.attack_speed=검은 -2.4, 도끼는 약 -3.0입니다.
help.burn_time=0이면 연료가 아닙니다. 석탄은 1600틱 (20틱 = 1초).
help.vanilla_base=데이터팩과 플러그인은 새 아이템을 추가할 수 없어, 이름, 모델, 데이터를 바꾼 바닐라 아이템을 대신 사용합니다.
help.custom_model_data=0이면 번호를 자동으로 정합니다.
help.shape=정육면체는 텍스처 1장, 기둥은 끝면과 옆면이 따로, 교차는 식물용입니다.
help.hardness=돌 1.5, 철광석 3, 흑요석 50. -1은 부술 수 없습니다.
help.resistance=돌 6, 흑요석 1200.
help.light=0에서 15. 횃불은 14입니다.
help.transparent=유리나 잎처럼 반대편이 보이는 블록에 사용합니다.
help.friction=보통 0.6, 얼음은 0.98입니다.
help.tool_level=드롭에 필요한 최소 도구 재료입니다.
help.requires_tool=알맞은 도구가 없으면 느리게 캐지고 아무것도 드롭하지 않습니다.
help.silk_touch=켜면 섬세한 손길로 블록 자체가 드롭됩니다.
help.ore=모드에서 월드 생성에 추가됩니다. 데이터팩은 새 블록을 생성할 수 없습니다.
help.ore_size=광맥 하나의 블록 수. 철은 9입니다.
help.ore_count=청크당 광맥 수. 철은 약 10입니다.
help.shaped=격자에 아이템을 놓습니다. 가장자리의 빈 줄과 칸은 제거되므로 격자 어디에 놓아도 됩니다.
help.shapeless=아이템을 어떤 순서로 놓아도 됩니다.
help.group=같은 그룹의 레시피는 레시피 책에서 함께 표시됩니다.
help.cook_time=화로 200, 용광로와 훈연기 100, 모닥불 600.
help.smithing=네더라이트 강화처럼 형판, 기반 아이템, 추가 재료를 사용합니다.
help.slot=칸을 클릭해 아이템을 고르고, 우클릭으로 지웁니다. #minecraft:planks 같은 태그도 쓸 수 있습니다.
help.replaces=새 테이블이면 비워 둡니다. 바닐라 테이블을 교체하려면 minecraft:chests/simple_dungeon처럼 입력합니다.
help.loot_weight=가중치: 클수록 잘 나옵니다. 행운과 마법 부여는 아이템 항목에만 적용됩니다.
help.parent=비우면 새 발전 과제 탭의 첫 과제가 됩니다.
help.background=첫 과제에만 사용. 블록 텍스처 경로. 예: minecraft:textures/block/stone.png
help.trigger_value=발전 과제를 달성하는 아이템, 블록, 엔티티, 차원. 비우면 무엇이든 됩니다.
help.reward_function=플레이어에게 실행할 함수. 예: mymod:reward
help.tag_namespace=비우면 모드 ID를 사용합니다. 모드 간 공유 태그는 c, 바닐라 태그 확장은 minecraft를 사용합니다.
help.replace=다른 팩이 추가한 값을 지웁니다. 보통은 끕니다.
help.tag_values=ID 또는 다른 태그(#로 시작)를 넣을 수 있습니다.
help.on_load=/reload 후와 월드 시작 시 한 번 실행됩니다.
help.on_tick=1초에 20번 실행됩니다. 짧게 유지하세요.
help.mcfunction=한 줄에 명령어 하나, 앞의 /는 필요 없습니다. #으로 시작하는 줄은 주석입니다.
help.run_function=게임에서 실행: {0}
help.code_file=선택한 플랫폼의 생성 프로젝트에 그대로 복사됩니다.
