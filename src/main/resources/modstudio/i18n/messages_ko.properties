types.item.desc=재료, 음식, 도구. 모드에서는 그대로, 데이터팩과 플러그인에서는 변형한 바닐라 아이템으로 동작합니다.
types.block.desc=건축 블록과 광석. 드롭, 채굴 규칙, 월드 생성을 설정할 수 있습니다. 블록은 모드 플랫폼이 필요합니다.
types.creative_tab.desc=크리에이티브 인벤토리에 나만의 탭을 추가해 아이템과 블록을 보여 줍니다 (모드 전용).
types.sound.desc=.ogg 파일로 사용자 지정 소리를 추가합니다. 프로시저와 명령어에서 재생할 수 있습니다.
types.recipe.desc=제작, 제련, 석재 절단, 대장장이 레시피를 눈으로 보며 만듭니다.
types.loot_table.desc=상자, 몹, 낚시, 블록의 무작위 보상. 바닐라 테이블을 교체할 수도 있습니다.
types.advancement.desc=아이콘, 조건, 보상이 있는 목표로, 발전 과제 화면에 표시됩니다.
types.tag.desc=아이템, 블록, 엔티티, 함수의 묶음. 예: 다른 모드와 공유하는 c:gems
types.function.desc=로드 시, 매 틱, 또는 호출 시 실행되는 명령어 파일 (mcfunction).
types.procedure.desc=비주얼 로직: 우클릭이나 블록 파괴 같은 트리거를 고르고 단계를 추가합니다. 모든 플랫폼에서 동작합니다.
types.command.desc=/mycommand 같은 채팅 명령어로 단계를 실행합니다. 데이터팩에서는 /trigger를 사용합니다.
types.code_file.desc=고급 기능을 위해 직접 작성한 Java 파일이나 리소스를 생성된 프로젝트에 복사합니다.

