section.screen_use=Using it
help.screen_use=Open it with the procedure step Open screen (an overlay is shown instead), close it with Close screen, and show or hide an overlay with Show overlay and Hide overlay. Buttons can close the screen, open another screen, run a procedure, open a web page or run a command as the player. Players need the mod on the client; the namespace of the hidden messages is {0}.ui.
help.screen_values=Texts can show values: {player}, {health}, {max_health}, {food}, {level}, {armor}, {x}, {y}, {z}, {dimension}, {day}, {game_time}, {score:objective}, the computer's {time} and {date}, {fps}, {os}, {java}, {memory}, and the music playing on the computer: {media_title}, {media_artist}, {media} (Windows media controls, Spotify or Music on macOS, playerctl on Linux; read only on that computer, nothing is sent). Icons from icon fonts work too (:name:).
