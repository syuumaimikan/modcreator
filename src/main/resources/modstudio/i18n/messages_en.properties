resource.start.pollution=When pollution reaches {0}
section.resource.usage=Using the amounts
help.resource.usage_buffer=Each machine keeps the amount in the score {0}.r.{1} and its capacity in {0}.c.{1}. Use the step "Add resource" to fill or drain the nearest machine and the condition "Resource amount" to check it. HUD lines can show it with a score placeholder on the machine marker.
help.resource.usage_stress=Generators provide their stress units (score {0}.su.{1}) at their RPM. Every consumer adds up the generators and consumers connected through neighbouring machines; when demand is higher than capacity the consumer stops, breaks or explodes, as set on the machine. The network speed is kept in {0}.rpm.
