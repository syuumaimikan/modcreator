help.resource.model=Stored amounts flow from producers to stores and consumers. Capacity and demand add up all connected generators and consumers; when demand is higher the network is overloaded.
section.resource.pollution=Pollution
help.resource.pollution=Output that does not fit into a full machine becomes pollution for the whole world. When it reaches the limit, the steps below run at that machine and pollution starts again from zero.
