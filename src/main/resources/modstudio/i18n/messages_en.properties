help.name=Used in IDs such as {0}:name. Lowercase letters, numbers and _ only.
help.name_path=Lowercase letters, numbers and _. Use / for sub folders, for example chests/treasure.
help.name_codefile=Only used inside ModStudio.
help.mod_id=Lowercase, 2 to 64 characters, starts with a letter. Cannot easily be changed after release.
help.mod_id_change=Changing the mod ID updates every reference in the project.
help.package=Java package of the generated code, for example com.yourname.mymod.
help.version=Version of your mod, for example 1.0.0.
help.icon=Shown in the mod list and as the pack icon.
help.texture=Click + to draw a new texture or use import for a PNG file.
help.tooltip=Extra lines below the name. Use & color codes such as &6 for gold.
help.nutrition=Half drumsticks. A cooked steak restores 8.
help.saturation=Saturation modifier. Steak uses 0.8.
help.tier=Defines durability, mining level and the base damage.
help.attack_damage=Added to the tier damage. Diamond sword uses 3.
help.attack_speed=Swords use -2.4, axes about -3.0.
help.burn_time=0 means not a fuel. Coal burns 1600 ticks (20 ticks = 1 second).
help.vanilla_base=Datapacks and plugins cannot add new items, so a vanilla item with custom name, model and data is used instead.
help.custom_model_data=0 chooses a number automatically.
help.shape=Cube uses one texture; pillar has separate end and side textures; cross is for plants; crop grows in stages on farmland.
help.hardness=Stone 1.5, iron ore 3, obsidian 50. -1 makes it unbreakable.
help.resistance=Stone 6, obsidian 1200.
help.light=0 to 15. Torches give 14.
help.transparent=Use for glass, leaves and other see-through blocks.
help.friction=0.6 is normal, ice uses 0.98.
help.tool_level=Minimum tool material needed to get drops.
help.requires_tool=Without the tool, mining is slow and nothing drops.
help.silk_touch=When enabled, silk touch drops the block itself.
help.ore=Adds the block to world generation in mods. Datapacks cannot generate new blocks.
help.ore_size=Blocks per vein. Iron uses 9.
help.ore_count=How many veins per chunk. Iron uses about 10.
help.shaped=Place items in the grid. Empty rows and columns at the edges are removed, so the shape works anywhere in the grid.
help.shapeless=Items can be placed in any order.
help.group=Recipes with the same group are shown together in the recipe book.
help.cook_time=Furnace 200, blast furnace and smoker 100, campfire 600.
help.smithing=Template, base item and addition, like netherite upgrades.
help.slot=Click a slot to choose an item, right click to clear it. Tags such as #minecraft:planks are allowed.
help.replaces=Leave empty for a new table. Enter for example minecraft:chests/simple_dungeon to replace a vanilla table.
help.loot_weight=Weight: higher means more likely. Fortune and enchant apply only to item entries.
help.parent=Empty makes this the root of a new advancement tab.
help.background=Only for root advancements. Path to a block texture, for example minecraft:textures/block/stone.png.
help.trigger_value=The item, block, entity or dimension that completes the advancement. Empty means any.
help.reward_function=Function to run for the player, for example mymod:reward.
help.tag_namespace=Empty uses your mod ID. Use c for tags shared between mods, or minecraft to extend vanilla tags.
help.replace=Removes values added by other packs. Usually off.
help.tag_values=Values can be IDs or other tags (starting with #).
help.on_load=Runs once after /reload and when the world starts.
help.on_tick=Runs 20 times per second. Keep it short.
help.mcfunction=One command per line without the leading /. Lines starting with # are comments.
help.run_function=Run in game with: {0}
help.code_file=Copied unchanged into the generated project of the chosen platform.
help.code_path=Path inside the project, for example src/main/java/{package}/custom/MyClass.java.
help.code_placeholders=Placeholders: {package_name} (Java package), {modid} and {main_class}.
help.creative_tab=Creative tabs exist only in mods. Items in datapacks and plugins are given with commands.
help.subtitle=Shown when subtitles are enabled.
help.stream=Streams the file instead of loading it. Use for music.
help.sound_files=Ogg Vorbis files. When there are several files, one is chosen at random.
help.proc_value=The item, block, entity or dimension that starts the procedure.
help.interval=20 ticks are one second.
help.steps=Steps run from top to bottom. In player triggers, @s is the player.
help.command=Players type /name in chat. In datapacks the command becomes /trigger name.
help.steps_command=Steps run as the player who typed the command.
help.permission=0 for everyone, 2 for operators, 4 for the server console only.
help.translations=Leave empty to use the English text.

