help.screen_refresh=How often the server sends the scores the overlay shows. 20 ticks are one second.
section.screen_layout=Layout
help.screen_layout=The preview is a 1920 x 1080 window at GUI scale 4 (480 x 270 GUI pixels). Widgets are placed relative to an anchor, so they stay in place on other window sizes.
help.screen_canvas=Click a widget to select it and drag to move it. Shift snaps to 4 pixels. Arrow keys move by 1 (10 with Shift); Delete removes it.
