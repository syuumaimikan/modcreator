types.item.desc=Materials, food and tools. Items work in mods, and in datapacks and plugins as customized vanilla items.
types.block.desc=Building blocks and ores with drops, mining rules and world generation. Blocks need a mod target.
types.creative_tab.desc=Own tabs in the creative inventory that list your items and blocks (mods only).
types.sound.desc=Custom sounds from .ogg files that can be played from procedures and commands.
types.recipe.desc=Crafting, smelting, stonecutting and smithing recipes with a visual grid.
types.loot_table.desc=Random rewards for chests, mobs, fishing or blocks. Can also replace vanilla tables.
types.advancement.desc=Goals with icons, triggers and rewards shown in the advancements screen.
types.tag.desc=Groups of items, blocks, entities or functions, for example c:gems shared with other mods.
types.function.desc=Command files (mcfunction) that run on load, every tick or when called.
types.procedure.desc=Visual logic: choose a trigger such as right click or block break, then add steps. Works on every platform.
types.command.desc=Chat commands such as /mycommand that run steps. Datapacks use /trigger instead.
types.code_file.desc=Your own Java or resource files copied into the generated project for advanced features.

