types.advancement.desc=Goals with icons, triggers and rewards shown in the advancements screen.
types.tag.desc=Groups of items, blocks, entities or functions, for example c:gems shared with other mods.
types.function.desc=Command files (mcfunction) that run on load, every tick or when called.
types.procedure.desc=Visual logic: choose a trigger such as right click or block break, then add steps. Works on every platform.
types.command.desc=Chat commands such as /mycommand that run steps. Datapacks use /trigger instead.
types.code_file.desc=Your own Java or resource files copied into the generated project for advanced features.

