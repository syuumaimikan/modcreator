help.screen=A screen the mod draws on the client. A screen opens like a menu and closes with Esc; an overlay stays on the HUD over the game. Procedures open, close, show and hide them. Needs a mod loader target (Fabric, Forge or NeoForge).
field.screen_mode=Kind
