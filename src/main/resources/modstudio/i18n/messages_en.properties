help.multiblock.assembly=Like Immersive Engineering machines: build the structure, then right-click its core block with the tool. The blocks become one machine; with a model they turn into barriers and the model is shown instead. Left-click the core with the tool to take it apart again.
field.multiblock.assemble=Assemble with a tool
field.multiblock.tool=Tool
help.multiblock.tool=Item that assembles the machine. In data packs the right-click is only noticed for items based on a carrot on a stick or warped fungus on a stick.
field.multiblock.incomplete=Message when incomplete
field.multiblock.model=Machine model
help.multiblock.model=Shown in place of the blocks once assembled. The core block is at 0 to 16 in the model, and the model front (north) is the pattern front.
multiblock.keep_blocks=None (keep the blocks)
field.multiblock.model_scale=Model scale
help.multiblock.model_scale=1 means 16 model units per block.
field.multiblock.idle_animation=Idle animation
field.multiblock.work_animation=Working animation
field.multiblock.assemble_sound=Assembly sound
section.multiblock.processing=Processing
help.multiblock.processing=Items thrown onto the input port are processed by the first recipe that matches. The result goes into a container at the output port, or drops out there.
help.multiblock.ports=Ports are positions in the pattern (X, Y, Z as in the block grid). They may lie one block outside the pattern, for example a chest in front of the machine.
field.multiblock.input=Input port
field.multiblock.output=Output port
field.multiblock.resource=Runs on resource
help.multiblock.resource=A buffer resource (energy, mana) that nearby producers and stores deliver to the machine. Recipes use it per operation.
field.multiblock.work_particle=Particle while working
field.multiblock.work_sound=Sound when work starts
multiblock.recipe_title={0} x {1} to {2} x {3}
field.multiblock.recipe_input=Input
field.multiblock.recipe_output=Result
field.multiblock.recipe_secondary=Byproduct
help.multiblock.recipe_secondary=An extra result with a chance, like the extra dust of a crusher.
field.multiblock.recipe_chance=Byproduct chance (%)
field.multiblock.recipe_time=Time (ticks)
help.multiblock.recipe_time=20 ticks = 1 second.
field.multiblock.recipe_cost=Resource per operation
help.multiblock.recipe_cost=Taken from the machine's resource when the operation starts; the recipe waits until there is enough.
multiblock.add_recipe=Add recipe
section.multiblock.on_assemble=When assembled
help.multiblock.on_assemble=Runs as the player who assembled the machine, at the core block.
multiblock.start.assemble=When the machine is assembled
section.multiblock.on_use=When right-clicked
help.multiblock.on_use=Runs as the player who right-clicks the core of the assembled machine, for example to open a menu. Without steps the machine shows its status.
multiblock.start.use=When a player right-clicks the machine
section.multiblock.on_finish=When an operation finishes
help.multiblock.on_finish=Runs at the machine after each finished recipe, as the machine (use @p for the nearest player).
multiblock.start.finish=When an operation finishes
section.multiblock.on_disassemble=When taken apart
help.multiblock.on_disassemble=Runs at the machine when it is taken apart with the tool or a block of it is broken.
multiblock.start.disassemble=When the machine is taken apart
