problem.key_empty=キー割り当て「{0}」に手順がありません。
problem.key_duplicate=キー割り当て「{0}」は「{1}」と同じ初期のキーです。プレイヤーが変更できますが、最初は同じキーで両方が動きます。
problem.brew_tag=醸造レシピ「{0}」の材料にタグが使われています。アイテムを 1 つ指定してください。
problem.brew_potion=醸造レシピ「{0}」の「{1}」はポーションとして見つかりません。
problem.brew_new_potion=醸造レシピ「{0}」の「{1}」は Minecraft 1.20.5 以降にしかありません。
compat.brewing_pack=データパックでは醸造台のレシピを追加できません。
compat.brewing_custom_potion=ここではバニラのポーションだけ醸造できます。このプロジェクトのポーションは Mod にしかありません。
compat.brewing_luck=統合版には幸運のポーションがありません。
compat.loot_inject_pack=データパックは既存のルートテーブルを置き換えることしかできず、追加はできません。テーブル自体は出力され、loot コマンドで使えます。
compat.loot_inject_command=Mob が倒れた場所やブロックを壊した場所で loot コマンドで抽選します。道具や倒したプレイヤーについての条件は効かないことがあります。
compat.loot_inject_paper=プラグインで追加できるのは、チェスト、Mob、ブロックのテーブルだけです。
compat.loot_inject_bedrock=統合版で追加できるのは、Mob とブロックのテーブルだけです。
compat.key_none=キーを追加できるのは Mod だけです。ここで使うには代わりの操作を選んでください。
compat.key_fallback=キーの代わりに「{0}」で動きます。
voxel.up_to_layer=この層まで表示
voxel.view_home=視点を戻す（ダブルクリックでも可）
voxel.view_note=ドラッグで回転、右ドラッグで移動、ホイールで拡大縮小。バニラのブロックはこのPCにインストールされた Minecraft のモデルとテクスチャで表示します。
voxel.view_no_game=ドラッグで回転、ホイールで拡大縮小。公式ランチャーで Minecraft をインストールする（または Fabric 向けを一度ビルドする）と、バニラのブロックが実際のモデルで表示されます。それまでは色付きの立方体です。
