help.name={0}:名前 の形で ID に使われます。半角小文字、数字、_ のみ使えます。
help.name_path=半角小文字、数字、_ のみ。/ でフォルダー分けできます (例: chests/treasure)。
help.name_codefile=ModStudio 内での名前です。
help.mod_id=半角小文字で 2 から 64 文字、先頭は英字。公開後は変更しないでください。
help.mod_id_change=MOD ID を変えると、プロジェクト内のすべての参照も更新されます。
help.package=生成されるコードの Java パッケージ。例: com.yourname.mymod
help.version=MOD のバージョン。例: 1.0.0
help.icon=MOD 一覧やパックのアイコンとして表示されます。
help.texture=+ で新しいテクスチャを描くか、PNG ファイルを読み込みます。
help.tooltip=名前の下に表示される行。&6 (金色) のような & カラーコードが使えます。
help.nutrition=半分の肉アイコン単位。ステーキは 8 回復します。
help.saturation=隠し満腹度の倍率。ステーキは 0.8 です。
help.tier=耐久値、採掘レベル、基本攻撃力が決まります。
help.attack_damage=ランクの攻撃力に加算されます。ダイヤモンドの剣は 3 です。
help.attack_speed=剣は -2.4、斧は -3.0 前後です。
help.burn_time=0 は燃料になりません。石炭は 1600 ティック (20 ティック = 1 秒)。
help.vanilla_base=データパックとプラグインは新しいアイテムを追加できないため、名前、モデル、データを変えたバニラのアイテムを使います。
help.custom_model_data=0 にすると自動で番号を決めます。
help.shape=立方体は1枚のテクスチャ、柱は端と側面が別、交差は植物用、作物は耕地で段階的に成長します。
help.hardness=石 1.5、鉄鉱石 3、黒曜石 50。-1 で壊せなくなります。
help.resistance=石 6、黒曜石 1200。
help.light=0 から 15。松明は 14 です。
help.transparent=ガラスや葉など、向こうが見えるブロックに使います。
help.friction=通常は 0.6、氷は 0.98 です。
help.tool_level=ドロップに必要な最低ランクのツール。
help.requires_tool=適正ツールがないと掘るのが遅く、何もドロップしません。
help.silk_touch=有効にすると、シルクタッチでブロック自体がドロップします。
help.ore=MOD ではワールド生成に追加されます。データパックでは新しいブロックを生成できません。
help.ore_size=1 つの鉱脈のブロック数。鉄は 9 です。
help.ore_count=チャンクあたりの鉱脈の数。鉄は約 10 です。
help.shaped=グリッドにアイテムを置きます。端の空いた行と列は取り除かれるので、作業台のどこに置いても使えます。
help.shapeless=アイテムをどの順番で置いてもかまいません。
help.group=同じグループのレシピはレシピ本でまとめて表示されます。
help.cook_time=かまど 200、溶鉱炉と燻製器 100、焚き火 600。
help.smithing=ネザライト強化のように、テンプレート、ベースアイテム、追加素材を使います。
help.slot=スロットをクリックしてアイテムを選び、右クリックで消します。#minecraft:planks のようなタグも使えます。
help.replaces=新しいテーブルなら空のまま。バニラのテーブルを置き換えるには minecraft:chests/simple_dungeon のように入力します。
help.loot_weight=重み: 大きいほど出やすくなります。幸運とエンチャントはアイテムのみに適用されます。
help.parent=空にすると、新しい進捗タブの最初の進捗になります。
help.background=最初の進捗のみ。ブロックテクスチャのパス。例: minecraft:textures/block/stone.png
help.trigger_value=進捗を達成するアイテム、ブロック、エンティティ、ディメンション。空なら何でもかまいません。
help.reward_function=プレイヤーに対して実行する関数。例: mymod:reward
help.tag_namespace=空なら MOD ID を使います。MOD 間で共有するタグは c、バニラのタグを拡張するなら minecraft にします。
help.replace=他のパックが追加した値を消します。通常はオフにしてください。
help.tag_values=ID または他のタグ (# で始まる) を指定できます。
help.on_load=/reload の後とワールド開始時に 1 回実行されます。
help.on_tick=1 秒に 20 回実行されます。短く保ってください。
help.mcfunction=1 行に 1 コマンド、先頭の / は不要です。# で始まる行はコメントです。
help.run_function=ゲーム内での実行: {0}
help.code_file=選んだプラットフォームの生成プロジェクトへそのままコピーされます。
help.code_path=プロジェクト内のパス。例: src/main/java/{package}/custom/MyClass.java
help.code_placeholders=置き換えられる文字: {package_name} (Java パッケージ)、{modid}、{main_class}
help.creative_tab=クリエイティブタブは MOD のみです。データパックとプラグインではコマンドでアイテムを入手します。
help.subtitle=字幕を有効にしたときに表示されます。
help.stream=ファイルを読み込まずに順次再生します。音楽向けです。
help.sound_files=Ogg Vorbis ファイル。複数ある場合はランダムに1つ再生されます。
help.proc_value=プロシージャを開始するアイテム、ブロック、エンティティ、ディメンション。
help.interval=20 ティックで 1 秒です。
help.steps=手順は上から順に実行されます。プレイヤーのきっかけでは @s がそのプレイヤーです。
help.command=プレイヤーはチャットで /名前 と入力します。データパックでは /trigger 名前 になります。
