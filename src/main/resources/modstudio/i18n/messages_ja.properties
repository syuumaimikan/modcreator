types.item.desc=素材、食べ物、道具など。MOD ではそのまま、データパックとプラグインではバニラアイテムを改造した形で動作します。
types.block.desc=建築ブロックや鉱石。ドロップ、採掘ルール、ワールド生成を設定できます。ブロックには MOD が必要です。
types.creative_tab.desc=クリエイティブインベントリに独自のタブを追加し、アイテムやブロックを並べます（MOD のみ）。
types.sound.desc=.ogg ファイルから独自のサウンドを追加します。プロシージャやコマンドから再生できます。
types.recipe.desc=作業台、かまど、石切台、鍛冶台のレシピを見たまま作成できます。
types.loot_table.desc=チェスト、モブ、釣り、ブロックのランダムな報酬。バニラのテーブルを置き換えることもできます。
types.advancement.desc=アイコン、達成条件、報酬を持つ目標。進捗画面に表示されます。
types.tag.desc=アイテム、ブロック、エンティティ、関数のグループ。例: 他の MOD と共有する c:gems
types.function.desc=ロード時、毎ティック、または呼び出し時に実行されるコマンドファイル (mcfunction)。
types.procedure.desc=ビジュアルロジック。右クリックやブロック破壊などのきっかけを選び、手順を追加します。すべてのプラットフォームで動作します。
types.command.desc=/mycommand のようなチャットコマンドで手順を実行します。データパックでは /trigger になります。
types.code_file.desc=高度な機能のために、独自の Java ファイルやリソースを生成プロジェクトへコピーします。

