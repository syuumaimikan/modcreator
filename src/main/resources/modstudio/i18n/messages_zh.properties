help.name=用于 {0}:名称 形式的 ID。只能使用小写字母、数字和 _。
help.name_path=小写字母、数字和 _。可用 / 分隔子文件夹，例如 chests/treasure。
help.name_codefile=仅在 ModStudio 内部使用。
help.mod_id=小写，2 到 64 个字符，以字母开头。发布后请勿更改。
help.mod_id_change=更改模组 ID 会同时更新项目中的所有引用。
help.package=生成代码的 Java 包名，例如 com.yourname.mymod。
help.version=模组版本，例如 1.0.0。
help.icon=显示在模组列表中，并作为包的图标。
help.texture=点击 + 绘制新纹理，或导入 PNG 文件。
help.tooltip=显示在名称下方的额外行。可以使用 &6（金色）这样的 & 颜色代码。
help.nutrition=以半个鸡腿为单位。牛排恢复 8。
help.saturation=饱和度系数。牛排为 0.8。
help.tier=决定耐久度、挖掘等级和基础伤害。
help.attack_damage=加在等级伤害之上。钻石剑为 3。
help.attack_speed=剑为 -2.4，斧约为 -3.0。
help.burn_time=0 表示不是燃料。煤炭燃烧 1600 刻（20 刻 = 1 秒）。
help.vanilla_base=数据包和插件无法添加新物品，因此使用带有自定义名称、模型和数据的原版物品代替。
help.custom_model_data=0 表示自动分配编号。
help.shape=立方体使用一张纹理；柱状有独立的端面和侧面纹理；交叉用于植物；作物在耕地上分阶段生长。
help.hardness=石头 1.5，铁矿石 3，黑曜石 50。-1 表示无法破坏。
help.resistance=石头 6，黑曜石 1200。
help.light=0 到 15。火把为 14。
help.transparent=用于玻璃、树叶等可以透视的方块。
help.friction=普通为 0.6，冰为 0.98。
help.tool_level=获得掉落物所需的最低工具材料。
help.requires_tool=没有正确工具时挖掘很慢，并且不会掉落。
help.silk_touch=启用后，精准采集会掉落方块本身。
help.ore=在模组中加入世界生成。数据包无法生成新方块。
help.ore_size=每个矿脉的方块数。铁为 9。
help.ore_count=每个区块的矿脉数量。铁约为 10。
help.shaped=在网格中放置物品。边缘的空行和空列会被移除，因此可以放在网格的任意位置。
help.shapeless=物品可以按任意顺序放置。
help.group=同一分组的配方会在配方书中显示在一起。
help.cook_time=熔炉 200，高炉和烟熏炉 100，营火 600。
help.smithing=模板、基础物品和附加材料，例如下界合金升级。
help.slot=点击格子选择物品，右键清除。也可以使用 #minecraft:planks 这样的标签。
help.replaces=新建表时留空。输入例如 minecraft:chests/simple_dungeon 可替换原版表。
help.loot_weight=权重：越大越容易出现。时运和附魔仅适用于物品条目。
help.parent=留空则成为新进度标签页的根进度。
help.background=仅用于根进度。方块纹理路径，例如 minecraft:textures/block/stone.png。
help.trigger_value=完成进度所需的物品、方块、实体或维度。留空表示任意。
help.reward_function=对玩家运行的函数，例如 mymod:reward。
help.tag_namespace=留空则使用模组 ID。模组间共享的标签用 c，扩展原版标签用 minecraft。
help.replace=移除其他包添加的值。通常保持关闭。
help.tag_values=值可以是 ID 或其他标签（以 # 开头）。
help.on_load=在 /reload 之后和世界启动时运行一次。
help.on_tick=每秒运行 20 次。请保持简短。
help.mcfunction=每行一条命令，不需要开头的 /。以 # 开头的行是注释。
help.run_function=在游戏中运行: {0}
help.code_file=原样复制到所选平台的生成项目中。
help.code_path=项目内的路径，例如 src/main/java/{package}/custom/MyClass.java。
help.code_placeholders=占位符: {package_name}（Java 包名）、{modid} 和 {main_class}。
help.creative_tab=创造模式物品栏仅存在于模组中。数据包和插件中的物品通过命令获得。
help.subtitle=开启字幕时显示。
help.stream=不预先加载，边读边播。适用于音乐。
help.sound_files=Ogg Vorbis 文件。有多个文件时随机播放其中一个。
help.proc_value=启动过程的物品、方块、实体或维度。
help.interval=20 刻为 1 秒。
help.steps=步骤从上到下运行。在玩家触发器中，@s 表示该玩家。
help.command=玩家在聊天中输入 /名称。在数据包中命令变为 /trigger 名称。
help.steps_command=步骤以输入命令的玩家身份运行。
help.permission=0 为所有人，2 为管理员，4 仅限服务器控制台。
help.translations=留空则使用英文文本。

